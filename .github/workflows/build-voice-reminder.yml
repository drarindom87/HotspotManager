
name: Build Voice Reminder APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceReminder_Android16_Project.zip'
      - '.github/workflows/build-voice-reminder.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          unzip -o VoiceReminder_Android16_Project.zip -d source
          test -f source/VoiceReminder/app/build.gradle.kts

      - name: Build APK
        working-directory: source/VoiceReminder
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceReminder-debug-apk
          path: source/VoiceReminder/app/build/outputs/apk/debug/app-debug.apk
