

name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HotspotManager_Android16_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: unzip -o HotspotManager_Android16_Project.zip -d source

      - name: Fix Android hotspot settings reference
        working-directory: source/HotspotManager
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/example/hotspotmanager/MainActivity.kt")
          s = p.read_text()

          old = "Intent(Settings.ACTION_TETHER_SETTINGS)"
          new = 'Intent("android.settings.TETHER_SETTINGS")'

          assert old in s, "Expected Android settings reference not found"
          p.write_text(s.replace(old, new))
          print("Android settings reference fixed")
          PY

      - name: Configure JVM 17
        working-directory: source/HotspotManager
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "targetCompatibility" not in s:
              s = s.replace(
                  "    defaultConfig {",
                  """    compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }
                  defaultConfig {"""
              )

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: source/HotspotManager
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HotspotManager-debug-apk
          path: source/HotspotManager/app/build/outputs/apk/debug/app-debug.apk
