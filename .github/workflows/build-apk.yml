
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HotspotManager_Android16_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: unzip -o HotspotManager_Android16_Project.zip -d source

      - name: Build APK
        working-directory: source/HotspotManager
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HotspotManager-debug-apk
          path: source/HotspotManager/app/build/outputs/apk/debug/app-debug.apk
